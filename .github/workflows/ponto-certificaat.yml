name: Ponto-certificaat uploaden
on:
  workflow_dispatch:
    inputs:
      naam:
        description: "Naam bij Cloudflare (bijv. ponto-sandbox of ponto-live)"
        required: true
        default: ponto-sandbox
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Bestanden klaarzetten
        env:
          PONTO_CERT: ${{ secrets.PONTO_CERT }}
          PONTO_KEY: ${{ secrets.PONTO_KEY }}
          PONTO_KEY_PASS: ${{ secrets.PONTO_KEY_PASS }}
        run: |
          umask 077
          printf '%s\n' "$PONTO_CERT" > cert.pem
          printf '%s\n' "$PONTO_KEY" > key-in.pem
          if [ -n "$PONTO_KEY_PASS" ]; then
            openssl pkey -in key-in.pem -passin env:PONTO_KEY_PASS -out key.pem
          else
            openssl pkey -in key-in.pem -out key.pem
          fi
          openssl x509 -in cert.pem -noout -subject -enddate
      - name: Uploaden
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 mtls-certificate upload --cert cert.pem --key key.pem --name "${{ inputs.naam }}" | tee uit.txt
          echo "### Certificaat geüpload" >> "$GITHUB_STEP_SUMMARY"
          grep -i "id" uit.txt >> "$GITHUB_STEP_SUMMARY" || true
      - name: Opruimen
        if: always()
        run: rm -f cert.pem key-in.pem key.pem
