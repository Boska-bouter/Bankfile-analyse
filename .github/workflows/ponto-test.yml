name: Ponto-test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Verbinding met Ponto testen
        env:
          PONTO_CERT: ${{ secrets.PONTO_CERT }}
          PONTO_KEY: ${{ secrets.PONTO_KEY }}
          PONTO_KEY_PASS: ${{ secrets.PONTO_KEY_PASS }}
          PONTO_CLIENT_ID: ${{ secrets.PONTO_CLIENT_ID }}
          PONTO_CLIENT_SECRET: ${{ secrets.PONTO_CLIENT_SECRET }}
        run: |
          set +e
          umask 077
          printf '%s\n' "$PONTO_CERT" > cert.pem
          printf '%s\n' "$PONTO_KEY" > key-in.pem
          if [ -n "$PONTO_KEY_PASS" ]; then openssl pkey -in key-in.pem -passin env:PONTO_KEY_PASS -out key.pem; else cp key-in.pem key.pem; fi
          echo "Certificaat:"; openssl x509 -in cert.pem -noout -subject -issuer -enddate
          echo "Sleutel hoort bij certificaat:"; [ "$(openssl x509 -in cert.pem -noout -pubkey | openssl sha256)" = "$(openssl pkey -in key.pem -pubout | openssl sha256)" ] && echo JA || echo NEE
          echo; echo "== 1. Zonder certificaat"
          curl -sS -o uit0.txt -w "HTTP %{http_code}\n" -X POST https://api.ibanity.com/ponto-connect/oauth2/token || true
          head -c 300 uit0.txt 2>/dev/null; echo
          echo; echo "== 2. Met certificaat (client_credentials)"
          curl -sS -o uit.txt -w "HTTP %{http_code}\n" --cert cert.pem --key key.pem \
            -u "$PONTO_CLIENT_ID:$PONTO_CLIENT_SECRET" -H "Accept: application/vnd.api+json" \
            -d grant_type=client_credentials -d client_id="$PONTO_CLIENT_ID" \
            https://api.ibanity.com/ponto-connect/oauth2/token || true
          sed -E 's/"(access_token|refresh_token)":"[^"]*"/"\1":"(verborgen)"/g' uit.txt 2>/dev/null | head -c 500; echo
          echo; echo "== 3. Met certificaat, TLS-details"
          curl -sS -o /dev/null -v --cert cert.pem --key key.pem https://api.ibanity.com/ponto-connect/financial-institutions 2>&1 | grep -E "SSL|TLS|HTTP/|alert|issuer|subject" | head -20 || true
      - name: Opruimen
        if: always()
        run: rm -f cert.pem key-in.pem key.pem uit.txt uit0.txt
